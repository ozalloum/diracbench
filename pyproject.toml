[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diracbench-svt"
version = "0.0.0"
description = "Reproducible multi-method benchmarks for spherical radial Dirac bound states"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Othman H. Y. Zalloum", email = "ozalloum@ppu.edu"}
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=1.5",
  "matplotlib>=3.7",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools]
package-dir = {"" = "src"}
py-modules = ["diracbench_svt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
